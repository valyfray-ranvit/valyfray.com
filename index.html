<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>VALYFRAY</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="page">
			<div class="window banner-wrap">
				<div class="titlebar">
					<span>.//home</span>
					<div class="dots"><span></span><span></span><span></span></div>
				</div>
				<div class="content">
					<h1 style="font-size:120px; text-align:center; margin:18px;">VALYFRAY</h1>
				</div>
			</div>
			<div class="left-stack">
				<div class="window">
					<div class="titlebar">
						<span>.//now-playing</span>
						<div class="dots"><span></span><span></span><span></span></div>
					</div>
					<div class="content player">
						<div class="screen">
							TRACK 01 / QUEUE 13
						</div>
						<div class="embed-slot">
							<iframe width="70%" height="70%" src="https://www.youtube.com/embed/videoseries?si=UJThcLza_9C3pPFA&amp;list=PLOfBaOx2cchXoZ5rGv5i8OrhnyWR6CQhk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" style="border:none;" allowfullscreen></iframe>
						</div>
						<div class="bars">
							<span></span><span></span><span></span><span></span><span></span>
						</div>
					</div>
				</div>
				<div class="window">
					<div class="titlebar">
						<span>.//currently-hooked-on</span>
						<div class="dots"><span></span><span></span><span></span></div>
					</div>
					<div class="content hooked-list">
						<div class="hooked-item">
							<h3><span class="hooked-tag">WATCHING</span></h3>
							<p><span class="hooked-title"><ul>
									<li>show</li>
									<li>show</li>
									<li>show</li>
								</ul></span></p>
						</div>
						<div class="hooked-item">
							<h3><span class="hooked-tag">Listening</span></h3>
							<p><span class="hooked-title"><ul>
									<li>song</li>
								</ul></span></p>
						</div>
						<div class="hooked-item">
							<h3><span class="hooked-tag">Reading</span></h3>
							<p><span class="hooked-title"><ul>
									<li>book</li>
								</ul></span></p>
						</div>
					</div>
				</div>
			</div>
			<div class="window">
				<div class="titlebar">
					<span>.//journal</span>
					<div class="dots"><span></span><span></span><span></span></div>
				</div>
				<div class="content">
					<h1 style="font-size:48px; text-shadow: 0 0 0, 3px 3px 0 var(--royal-dim); text-align:center;">UPDATES</h1>
					<div class="entry">
						<div class="entry-head"><h3>2026.08.14</h3></div>
						<div class="entry-body">
							<p>-Website Made.</p><p>-Version 1 Live.</p>
						</div>
						<div></div>
					</div>
				</div>
			</div>
			<div class="window">
				<div class="titlebar">
					<span>.//navigation</span>
					<div class="dots"><span></span><span></span><span></span></div>
				</div>
				<div class="content">
					<h1 style="text-shadow: 0 0 0, 3px 3px 0 var(--royal-dim)">CONTENT</h1>
					<p>
						<ul style="font-weight: bold; justify-content:space-between;">
							<li><a href="#">HOME</a></li>
							<li><a href="#">ABOUT</a></li>
							<li><a href="#">PROJECTS</a></li>
						</ul>
					</p>
				</div>
			</div>
		</div>
	</body>
</html>
