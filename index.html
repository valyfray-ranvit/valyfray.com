<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>VALYFRAY</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="page">
			<div class="window banner-wrap">
				<div class="titlebar">
					<span>.//home</span>
					<div class="dots"><span></span><span></span><span></span></div>
				</div>
				<div class="content">
					<h1 style="font-size:120px; text-align:center; margin:18px;">VALYFRAY</h1>
				</div>
			</div>
			<div class="left-stack">
				<div class="window">
					<div class="titlebar">
						<span>.//music</span>
						<div class="dots"><span></span><span></span><span></span></div>
					</div>
					<div class="content">MUSIC</div>
				</div>
				<div class="window">
					<div class="titlebar">
						<span>.//interests</span>
						<div class="dots"><span></span><span></span><span></span></div>
					</div>
					<div class="content hooked-list">
						<div class="hooked-item">
							<span class="hooked-tag">WATCHING</span>
							<span class="hooked-title">show</span>
						</div>
						<div class="hooked-item">
							<span class="hooked-tag">Listening</span>
							<span class="hooked-title">song</span>
						</div>
						<div class="hooked-item">
							<span class="hooked-tag">Reading</span>
							<span class="hooked-title">book</span>
						</div>
					</div>
				</div>
			</div>
			<div class="window">
				<div class="titlebar">
					<span>.//journal</span>
					<div class="dots"><span></span><span></span><span></span></div>
				</div>
				<div class="content">
					<h1 style="font-size:48px; text-shadow: 0 0 0, 3px 3px 0 var(--royal-dim); text-align:center;">UPDATES</h1>
					<div class="entry">
						<div class="entry-head"><h3>2026.08.14</h3></div>
						<div class="entry-body">
							<p>-Website Made.</p><p>-Version 1 Live.</p>
						</div>
						<div></div>
					</div>
				</div>
			</div>
			<div class="window">
				<div class="titlebar">
					<span>.//navigation</span>
					<div class="dots"><span></span><span></span><span></span></div>
				</div>
				<div class="content">
					<h1 style="text-shadow: 0 0 0, 3px 3px 0 var(--royal-dim)">CONTENT</h1>
					<p>
					<h3>
						<ul>
				<li><a href="#">HOME</a></li>
				<li><a href="#">ABOUT</a></li>
				<li><a href="#">PROJECTS</a></li>
						</ul>
					</h3>
					</p>
				</div>
			</div>
		</div>
	</body>
</html>
